name: tauri

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-tauri:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      # ── App version ───────────────────────────────────────────────────────
      # The tag is the release identity, so it is the app version too. Without
      # this, the version committed in tauri.conf.json (not the tag) names the
      # installers and fills in latest.json, so a tagged release republishes
      # whatever version happens to be committed.
      # `--config` is the only override that works: the CLI *writes* TAURI_CONFIG
      # from it for the Rust build scripts but never reads that variable, so
      # exporting TAURI_CONFIG would version the app while leaving the installer
      # filenames and latest.json at the committed version.
      - name: Derive app version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Tag '$tag' is not a plain vX.Y.Z version. The Windows bundlers require major.minor.build, and the updater compares this against latest.json."
          }
          # Forward slashes only: tauri-action parses its `args` input with
          # string-argv, which would swallow backslashes as escape characters.
          $conf = (Join-Path $env:RUNNER_TEMP 'version.conf.json') -replace '\\', '/'
          @{ version = $version } | ConvertTo-Json -Compress | Set-Content $conf -Encoding utf8NoBOM
          "VERSION_CONFIG=$conf" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8NoBOM
          Write-Host "Stamping app version $version (from tag $tag)"

      # ── Signing provider ──────────────────────────────────────────────────
      # `secrets` is not an allowed context in a step's `if` — GitHub lists only
      # github/needs/strategy/matrix/job/runner/env/vars/steps/inputs there — and
      # referencing it fails the entire workflow at startup, before any runner is
      # allocated. Resolve it once into a step output, which `if` does allow, and
      # keep the token scoped to the step that reads it rather than passing it to
      # every step in the job.
      - name: Detect signing provider
        id: signing
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          $configured = if ($env:SIGNPATH_API_TOKEN) { 'true' } else { 'false' }
          "configured=$configured" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8NoBOM
          Write-Host "SignPath configured: $configured"

      # ── Code signing ──────────────────────────────────────────────────────
      # Three providers, in priority order: SignPath (free OSS) > Azure > OV PFX.
      # If none configured, build stays unsigned (SmartScreen + AV warnings).
      # See docs/windows-signing.md and docs/signing-policy.md
      # ── SignPath Foundation (FREE for OSS — recommended) ──────────────────
      # Requires SignPath approval at https://signpath.org/apply
      # Secrets needed: SIGNPATH_API_TOKEN, SIGNPATH_ORGANIZATION_ID
      # Optional: SIGNPATH_PROJECT_SLUG (default cmis), SIGNPATH_SIGNING_POLICY_SLUG (default release-signing)
      # Publisher will show "SignPath Foundation" — expected for OSS builds.
      # This path bypasses local Tauri signing and uses SignPath's HSM via external signing.

      # ── Local signing config (OV PFX / Azure) ─────────────────────────────
      # These only run if SignPath is NOT configured (to avoid double-sign).
      - name: Configure code signing — OV certificate (PFX)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ($env:SIGNPATH_API_TOKEN) {
            Write-Host "SignPath configured — skipping local OV PFX setup (SignPath will sign externally)"
            exit 0
          }
          if (-not $env:WINDOWS_CERTIFICATE) {
            Write-Host "No WINDOWS_CERTIFICATE secret — skipping OV PFX signing (build will be unsigned)"
            exit 0
          }
          Write-Host "OV certificate detected — importing to CurrentUser\My store..."

          $pfxPath = "$env:RUNNER_TEMP\cert.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))

          $securePass = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePass
          $thumbprint = $cert.Thumbprint
          Write-Host "Imported cert thumbprint: $thumbprint"

          $confPath = "apps/desktop/src-tauri/tauri.conf.json"
          $json = Get-Content $confPath -Raw | ConvertFrom-Json
          if (-not $json.bundle.windows) { $json.bundle | Add-Member -NotePropertyName windows -NotePropertyValue ([PSCustomObject]@{}) }
          $json.bundle.windows | Add-Member -NotePropertyName certificateThumbprint -NotePropertyValue $thumbprint -Force
          $json.bundle.windows.digestAlgorithm = "sha256"
          $json.bundle.windows.timestampUrl = "http://timestamp.digicert.com"
          if ($json.bundle.windows.PSObject.Properties['signCommand']) { $json.bundle.windows.PSObject.Properties.Remove('signCommand') }
          $json | ConvertTo-Json -Depth 10 | Set-Content $confPath -Encoding utf8
          Write-Host "Patched $confPath with certificateThumbprint"
          Get-Content $confPath | Write-Host
          Remove-Item $pfxPath -Force

      - name: Configure code signing — Azure Trusted Signing
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_TRUSTED_SIGNING_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
        run: |
          if ($env:SIGNPATH_API_TOKEN) {
            Write-Host "SignPath configured — skipping Azure setup"
            exit 0
          }
          if (-not $env:AZURE_TENANT_ID -or -not $env:AZURE_TRUSTED_SIGNING_ACCOUNT) {
            Write-Host "No Azure Trusted Signing secrets — skipping"
            exit 0
          }
          Write-Host "Azure Trusted Signing detected — configuring signCommand..."
          $endpoint = if ($env:AZURE_TRUSTED_SIGNING_ENDPOINT) { $env:AZURE_TRUSTED_SIGNING_ENDPOINT } else { "https://eus.codesigning.azure.net" }
          $account = $env:AZURE_TRUSTED_SIGNING_ACCOUNT
          $profile = $env:AZURE_TRUSTED_SIGNING_PROFILE
          $signCommand = "trusted-signing-cli sign -e $endpoint -a $account -c $profile -d $env:AZURE_TRUSTED_SIGNING_ENDPOINT %1"
          $confPath = "apps/desktop/src-tauri/tauri.conf.json"
          $json = Get-Content $confPath -Raw | ConvertFrom-Json
          if (-not $json.bundle.windows) { $json.bundle | Add-Member -NotePropertyName windows -NotePropertyValue ([PSCustomObject]@{}) }
          $json.bundle.windows | Add-Member -NotePropertyName signCommand -NotePropertyValue $signCommand -Force
          if ($json.bundle.windows.PSObject.Properties['certificateThumbprint']) { $json.bundle.windows.PSObject.Properties.Remove('certificateThumbprint') }
          $json | ConvertTo-Json -Depth 10 | Set-Content $confPath -Encoding utf8
          Write-Host "Patched $confPath with signCommand: $signCommand"
          Get-Content $confPath | Write-Host

      - name: Install Azure Trusted Signing CLI (if Azure configured)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
        run: |
          if ($env:SIGNPATH_API_TOKEN) { exit 0 }
          if (-not $env:AZURE_TENANT_ID -or -not $env:AZURE_TRUSTED_SIGNING_ACCOUNT) { exit 0 }
          Write-Host "Installing Trusted Signing CLI..."
          dotnet tool install --global Azure.CodeSigning.Tools 2>$null
          if ($LASTEXITCODE -ne 0) { dotnet tool update --global Azure.CodeSigning.Tools }
          Write-Host "Trusted Signing CLI ready"

      # ── Build paths ───────────────────────────────────────────────────────
      # Path A: SignPath (free OSS) — build unsigned, upload, sign externally, then publish
      - name: Build unsigned (for SignPath)
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.configured == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # `exec` rather than the desktop:build script: pnpm 12.3.4 does not strip the
        # `--` separator for `run`, so `run desktop:build -- --config <path>` reaches
        # tauri as `build -- --config <path>` and the flag is handed to cargo instead.
        run: pnpm --filter desktop exec tauri build --config "${{ env.VERSION_CONFIG }}"

      - name: Upload unsigned artifact (SignPath)
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.configured == 'true'
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installers
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          # SignPath docs recommend archive:false for direct artifact type, but we keep default zip
          # so artifact config should be <zip-file> wrapping the installers.

      - name: Submit signing request to SignPath (free OSS)
        if: steps.upload-unsigned.outputs.artifact-id != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG || 'cmis' }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
          parameters: |
            version: "${{ github.ref_name }}"

      - name: Publish signed release (SignPath)
        if: steps.upload-unsigned.outputs.artifact-id != ''
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Write-Host "Signed artifacts in ./signed:"
          Get-ChildItem signed -Recurse | ForEach-Object { Write-Host "  $($_.FullName)" }
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { $signtool = Get-ChildItem "C:\Program Files\Microsoft SDKs\Windows\*\bin\signtool.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if (-not $signtool) { throw "signtool.exe not found — Windows SDK missing on runner" }
          Write-Host "Using signtool: $($signtool.FullName)"
          $sig = Get-ChildItem signed -Recurse -Include *.exe,*.msi | Select-Object -First 1
          if ($sig) {
            Write-Host "Verifying signature on $($sig.FullName)"
            & $signtool.FullName verify /pa "$($sig.FullName)" 2>&1 | Write-Host
            if ($LASTEXITCODE -ne 0) { throw "signtool verify failed for $($sig.FullName) — expected signed artifact from SignPath" }
          }
          # Copy signed installers back over unsigned ones so updater JSON references match
          # (tauri build already generated latest.json with minisign; we just replace binaries)
          Get-ChildItem signed -Recurse -Include *.exe,*.msi | ForEach-Object {
            $dest = "apps/desktop/src-tauri/target/release/bundle"
            Copy-Item $_.FullName -Destination $dest -Recurse -Force
            Write-Host "Copied $($_.Name) to $dest"
          }
          # Publish via gh release (replaces tauri-action publish)
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null; if ($LASTEXITCODE -ne 0) { gh release create $tag --title "cmis $tag" --notes "See the assets to download and install this version. Signed via SignPath Foundation (free OSS)." }
          Get-ChildItem apps/desktop/src-tauri/target/release/bundle -Recurse -Include *.exe,*.msi,*.json | ForEach-Object {
            Write-Host "Uploading $($_.FullName)"
            gh release upload $tag "$($_.FullName)" --clobber
          }

      # Path B: Local signing (OV/Azure) or unsigned — use tauri-action publish
      - name: Build, sign and publish release (tauri-action — OV/Azure/unsigned)
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.configured != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        with:
          projectPath: apps/desktop
          args: --config ${{ env.VERSION_CONFIG }}
          tagName: ${{ github.ref_name }}
          releaseName: "cmis ${{ github.ref_name }}"
          releaseBody: "See the assets to download and install this version."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      - name: Verify signature (tag builds only — OV/Azure/unsigned path)
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.configured != 'true'
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { $signtool = Get-ChildItem "C:\Program Files\Microsoft SDKs\Windows\*\bin\signtool.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if (-not $signtool) { Write-Host "::warning::signtool.exe not found — skipping signature check (Windows SDK missing)"; exit 0 }
          Write-Host "Using signtool: $($signtool.FullName)"
          $exe = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          $msi = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/msi/*.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          foreach ($f in @($exe, $msi)) {
            if ($null -eq $f) { continue }
            Write-Host "Checking signature: $($f.FullName)"
            $out = & $signtool.FullName verify /pa "$($f.FullName)" 2>&1
            if ($LASTEXITCODE -eq 0) { Write-Host "  ✓ Signed: $out" } else { Write-Host "  ✗ NOT SIGNED (expected if no cert configured): $out" }
          }
          # Informational only: unsigned is expected when no signing secrets are configured.
          # signtool verify returns 1 for unsigned, which would otherwise fail the step via LASTEXITCODE.
          $global:LASTEXITCODE = 0
          exit 0

      - name: Build (no publish) — workflow_dispatch smoke build
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: pnpm --filter desktop desktop:build

      - name: Upload unsigned artifacts (dispatch only)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
