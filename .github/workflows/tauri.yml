name: tauri

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-tauri:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      # ── App version ───────────────────────────────────────────────────────
      # The tag is the release identity, so it is the app version too. Without
      # this, the version committed in tauri.conf.json (not the tag) names the
      # installers and fills in latest.json, so a tagged release republishes
      # whatever version happens to be committed.
      # `--config` is the only override that works: the CLI *writes* TAURI_CONFIG
      # from it for the Rust build scripts but never reads that variable, so
      # exporting TAURI_CONFIG would version the app while leaving the installer
      # filenames and latest.json at the committed version.
      - name: Derive app version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Tag '$tag' is not a plain vX.Y.Z version. The Windows bundlers require major.minor.build, and the updater compares this against latest.json."
          }
          # Forward slashes only: tauri-action parses its `args` input with
          # string-argv, which would swallow backslashes as escape characters.
          $conf = (Join-Path $env:RUNNER_TEMP 'version.conf.json') -replace '\\', '/'
          @{ version = $version } | ConvertTo-Json -Compress | Set-Content $conf -Encoding utf8NoBOM
          "VERSION_CONFIG=$conf" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8NoBOM
          Write-Host "Stamping app version $version (from tag $tag)"

      - name: Build, sign and publish release (tauri-action)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          args: --config ${{ env.VERSION_CONFIG }}
          tagName: ${{ github.ref_name }}
          releaseName: "cmis ${{ github.ref_name }}"
          releaseBody: "See the assets to download and install this version."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      - name: Build (no publish) — workflow_dispatch smoke build
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: pnpm --filter desktop desktop:build

      - name: Upload unsigned artifacts (dispatch only)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
