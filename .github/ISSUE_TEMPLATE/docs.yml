name: Docs / Question
description: Documentation fix, spec clarification, or scoping question for CMIS.
title: "[Docs] "
labels: ["documentation"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        For spec gaps and open product questions, file here.
  - type: dropdown
    id: doc_area
    attributes:
      label: Doc Area
      multiple: true
      options:
        - README / AGENTS.md
        - privacy / signing policy
        - In-app Help sections
        - Other
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current State
      description: What does the doc say today? Quote or link.
      placeholder: The viewer claim policy is unclear — is it auto-approved or Staff-approved?
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed Change / Question
      description: What should change or be decided? Provide options if relevant.
      placeholder: |
        Option A: auto-approve if in-stock, else queue.
        Option B: always require Staff approval.
        Preference: A for throughput, with audit log.
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Checks
      options:
        - label: I checked the existing docs and issues for coverage.
          required: true
