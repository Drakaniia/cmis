# Published migration checksums. One line per migration that has shipped in a
# release:  <file>.sql <sha256 of the file's bytes>
#
# Why this exists
# ---------------
# tauri-plugin-sql records a checksum for every migration it applies and panics
# at startup when a later build ships a file whose bytes no longer match
# ("migration N was previously applied but has been modified"). Editing a
# migration that has already shipped therefore bricks every install that
# updates past it, with no UI and no log - just exit code 101. That is not
# hypothetical: release 1.9.1 changed three SQL *comments* in
# 0013_vocabulary_terms.sql and every upgrading install stopped opening.
#
# The rule
# --------
#   Adding a migration is always fine and needs no change here.
#   Changing or deleting a shipped migration is never fine.
#   When you tag a release, append a line for each migration added since the
#   last release. That is what makes it "published".
#   To correct a migration that shipped broken, change the file AND its line
#   here in the same commit, so the correction is visible in review.
#
# Enforced by the `published-migrations` job in .github/workflows/ci.yml.

